services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command: >-
      postgres -c shared_buffers=64MB -c effective_cache_size=192MB
      -c work_mem=2MB -c maintenance_work_mem=32MB -c max_connections=25
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  api:
    build: ./backend
    env_file: ${SHOP_ENV_FILE:-.env}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    mem_limit: 320m
    restart: unless-stopped
    logging: *logging

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
  uploads:
