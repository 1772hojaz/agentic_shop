name: Application checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentic_shop_test
          POSTGRES_USER: shop_test
          POSTGRES_PASSWORD: ephemeral-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: ruff check app tests migrations
        working-directory: backend
      - run: ruff format --check app tests migrations
        working-directory: backend
      - run: python check_style.py
        working-directory: backend
      - run: pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://shop_test:ephemeral-ci-password@localhost:5432/agentic_shop_test
      - run: alembic upgrade head && alembic check
        working-directory: backend
      - run: alembic upgrade head && alembic check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://shop_test:ephemeral-ci-password@localhost:5432/agentic_shop_test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run build
        working-directory: frontend
